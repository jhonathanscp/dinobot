server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para evitar CORS com a Wuzapi
    location /api/wuzapi/ {
        # O Nginx vai remover o /api/wuzapi/ e passar o restante para o backend
        rewrite ^/api/wuzapi/(.*)$ /$1 break;
        
        # Nome do serviço no docker-compose é "wuzapi"
        proxy_pass http://wuzapi:8080;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Wuzapi usa WebSockets e requests longos para SSE/Status
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
